services:
  __MOKKAPI_SERVICE_ID__:
    build: .
    image: mokkapi-mock-__MOKKAPI_SERVICE_ID__
    # Host ports map to the container's HTTP (8080) and HTTPS (8443) listeners.
    ports:
      - "__MOKKAPI_PORT__:8080"
      - "__MOKKAPI_HTTPS_PORT__:8443"
    environment:
      # Modern ASP.NET port binding (.NET 8+). The mock self-generates a self-signed
      # dev cert, so NO certificate volume or Kestrel cert config is required here.
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8443
      # Uncomment to switch the active scenario at runtime:
      # - MOKKAPI_SCENARIO=Default
    restart: unless-stopped
